services:
  - type: web
    name: znk-snake-server
    env: node
    plan: free
    buildCommand: yarn install --frozen-lockfile; yarn workspace @znk/shared build; yarn workspace server build
    startCommand: yarn workspace server tsx dist/src/index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: CLIENT_ORIGIN
        sync: false

  - type: web
    name: znk-snake-client
    env: node
    plan: free
    buildCommand: yarn install --frozen-lockfile; yarn workspace @znk/shared build; yarn workspace client build
    startCommand: yarn workspace client vite preview --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: VITE_SERVER_URL
        sync: false
